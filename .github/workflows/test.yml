name: test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
        exclude:
          - { os: macos-latest, node: 18 }
          - { os: windows-latest, node: 18 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test tests/audit.test.cjs
      - run: node skills/flutter-l10n-audit/scripts/l10n-audit.cjs examples/clean_app --fail-on info
